services:
  api:
    build:
      context: .
      dockerfile: Homiee/Dockerfile

    image: homiee-backend:local

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: ${ASPNETCORE_URLS}
      ApplyMigrations: "true"

      ConnectionStrings__DefaultConnection: >
        Server=sqlserver,1433;
        Database=${DB_NAME};
        User Id=${DB_USER};
        Password=${DB_PASSWORD};
        TrustServerCertificate=True;
        Encrypt=False

      ConnectionStrings__Redis: ${REDIS_CONNECTION}

      JWT__Key: ${JWT_KEY}

      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}

      AzureBlob__ConnectionString: ${AZURE_BLOB_CONNECTION}

      Razorpay__Key: ${RAZORPAY_KEY}
      Razorpay__Secret: ${RAZORPAY_SECRET}

      AllowedOrigins__0: "https://homiee.suhailaslam.in"
      AllowedOrigins__1: http://127.0.0.1:5173

      Gemini__ApiKey: ${GEMINI__APIKEY}
      Gemini__ModelName: ${GEMINI__MODELNAME}
      Gemini__BaseUrl: ${GEMINI__BASEURL}
      Gemini__TimeoutSeconds: ${GEMINI__TIMEOUTSECONDS}
      Gemini__SampleCount: ${GEMINI__SAMPLECOUNT}

      AiImage__GenerationCacheTtlMinutes: ${AIIMAGE__GENERATIONCACHETTLMINUTES}
      AiImage__RateLimitMaxRequests: ${AIIMAGE__RATELIMITMAXREQUESTS}
      AiImage__RateLimitWindowMinutes: ${AIIMAGE__RATELIMITWINDOWMINUTES}
      AiImage__CooldownSeconds: ${AIIMAGE__COOLDOWNSECONDS}
      AiImage__MaxPromptLength: ${AIIMAGE__MAXPROMPTLENGTH}
      AiImage__MinPromptLength: ${AIIMAGE__MINPROMPTLENGTH}
      AiImage__MaxJobRetries: ${AIIMAGE__MAXJOBRETRIES}
      AiImage__ResultRetentionHours: ${AIIMAGE__RESULTRETENTIONHOURS}

    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}

    ports:
      - "1435:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest

    depends_on:
      sqlserver:
        condition: service_healthy

    entrypoint: ["/bin/bash", "-c"]

    command:
      - |
        set -e

                echo "Creating database..."
        
        /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "${SA_PASSWORD}" \
          -C \
          -b \
          -d master \
          -Q "
        IF DB_ID(N'${DB_NAME}') IS NULL
        BEGIN
            CREATE DATABASE [${DB_NAME}];
        END
        "
        
        echo "Waiting for database to become available..."
        
        until /opt/mssql-tools18/bin/sqlcmd \
          -S sqlserver \
          -U sa \
          -P "${SA_PASSWORD}" \
          -C \
          -d "${DB_NAME}" \
          -Q "SELECT 1" >/dev/null 2>&1
        do
          echo "Database not ready yet..."
          sleep 5
        done
        
        echo "Database ready"
        
        echo "Creating login..."
        
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "${SA_PASSWORD}" -C -b -d "${DB_NAME}" -Q "IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = N'${DB_USER}') BEGIN CREATE USER [${DB_USER}] FOR LOGIN [${DB_USER}]; END; ALTER ROLE db_owner ADD MEMBER [${DB_USER}];"

        echo "Done!"
        exit 0

    restart: "no"

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

volumes:
  sqlserver-data:
